[project]
name = "4-rag"
version = "0.1.0"
description = "RAG pipeline with LangChain, Groq, Ollama, and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core",
    "langchain-community",
    "langchain-groq",
    "langchain-ollama",
    "langchain-chroma",
    "langchain-text-splitters",
    "pypdf",
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "python-multipart",
    "python-dotenv",
    "pydantic-settings",
    "httpx",
    "chromadb",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
